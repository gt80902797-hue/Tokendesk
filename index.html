
<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TokenDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>🧾 TokenDesk</h1>
    <p>Apni shop, apna account</p>
  </header>

  <section id="auth" class="panel">
    <h2>Shop Account</h2>

    <div class="tabs">
      <button type="button" onclick="show('login')">Login</button>
      <button type="button" onclick="show('register')">Register</button>
    </div>

    <form id="login">
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="register" hidden>
      <input name="shopName" placeholder="Shop name" required>
      <input name="ownerName" placeholder="Owner name" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password"
        placeholder="Password (10+ characters)"
        minlength="10" required>
      <button type="submit">Register shop</button>
    </form>

    <p id="msg"></p>
  </section>

  <section id="dashboard" class="panel" hidden>
    <h2 id="shop"></h2>
    <p id="status"></p>

    <h3>Subscription plans</h3>
    <div class="plans">
      <button type="button" onclick="pay('30')">30 days — ₹100</button>
      <button type="button" onclick="pay('90')">90 days — ₹270</button>
      <button type="button" onclick="pay('365')">365 days — ₹999</button>
    </div>

    <button type="button" class="secondary" onclick="refresh()">Refresh</button>
    <button type="button" class="secondary" onclick="logout()">Logout</button>

    <h3>Shop orders</h3>
    <ul id="orders"></ul>

    <p id="dashmsg"></p>
  </section>

  <footer>
    TokenDesk — Shop account demo
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
