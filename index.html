<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TokenDesk</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>🧾 TokenDesk</h1><p>Secure shop subscription demo</p></header>
<section id="auth" class="panel"><h2>Shop account</h2><div class="tabs"><button onclick="show('login')">Login</button><button onclick="show('register')">Register</button></div>
<form id="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form>
<form id="register" hidden><input name="shopName" placeholder="Shop name" required><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (10+ characters)" minlength="10" required><button>Register</button></form><p id="msg"></p></section>
<section id="dashboard" class="panel" hidden><h2 id="shop"></h2><p id="status"></p><h3>Choose subscription</h3><div class="plans"><button onclick="pay('30')">30 days — ₹100</button><button onclick="pay('90')">90 days — ₹270</button><button onclick="pay('365')">365 days — ₹999</button></div><button class="secondary" onclick="refresh()">Refresh status</button><button class="secondary" onclick="logout()">Logout</button><h3>Payments</h3><ul id="payments"></ul><p id="dashmsg"></p></section>
<footer>Payment is activated only after server-side verification. This scaffold is not yet configured for real payments.</footer></main><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="app.js"></script></body></html>
